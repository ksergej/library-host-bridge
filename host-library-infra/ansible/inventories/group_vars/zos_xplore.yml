hlq: "Z88011"  # placeholder HLQ

ansible_connection: ssh
ansible_user: "Z88011"            # replace with your user
ansible_port: 22
ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

# z/OS USS Python (IBM Open Enterprise Python)
PYZ: "/usr/lpp/IBM/cyp/v3r9/pyz"
ZOAU: "/usr/lpp/IBM/zoautil"
ansible_python_interpreter: "{{ PYZ }}/bin/python3"

environment_vars:
  _BPXK_AUTOCVT: "ON"
  ZOAU_HOME: "{{ ZOAU }}"
  ZOAU_ROOT: "{{ ZOAU }}"
  PYTHONSTDINENCODING: "cp1047"
  LIBPATH: "{{ ZOAU }}/lib:{{ PYZ }}/lib:/lib:/usr/lib"
  PYTHONPATH: "{{ ZOAU }}/lib"
  PATH: "{{ ZOAU }}/bin:{{ PYZ }}/bin:/bin:/usr/bin"
  _CEE_RUNOPTS: "FILETAG(AUTOCVT,AUTOTAG) POSIX(ON)"
  _TAG_REDIR_ERR: "txt"
  _TAG_REDIR_IN: "txt"
  _TAG_REDIR_OUT: "txt"
  LANG: "C"
  LC_ALL: "C"

db2:
  subsystem: "DBDG"              # placeholder subsystem (e.g. DBC1/DSN1)
  plan: "{{ hlq }}"                # placeholder plan if bind/run uses it
  qualifier: "{{ hlq }}"           # schema qualifier
  loadlib: "DSND10.SDSNLOAD"       # placeholder SDSNLOAD
  exitlib: "DSND10.DBDG.SDSNEXIT"   # optional placeholder SDSNEXIT
  runlib: "SDSN.SDSNRUN"         # optional placeholder SDSNRUN
  dbrmlib: "{{ hlq }}.DBRMLIB"   # DBRM PDS/PDSE
  collection: "{{ hlq }}"        # used in BIND PKLIST(&COLL..*)
  tablespace: "Z88011.Z88011S"

mq:
  loadlib: "CSQ920.SCSQLOAD"         # placeholder MQ loadlib (SCSQLOAD)
  cobol_copylib: "CSQ920.SCSQCOBC"   # IBM MQ for z/OS 9.2 COBOL copybooks (CMQ*V)
  cobcopylib: "CSQ920.SCSQCOBC"      # alias (preferred name in CBLMQDB2 template)
  qmgr: "CSQ9"
  request_queue: "Z88011.MQZ3.QLOCAL"
  reply_queue: "Z88011.MQZ3.REPLYTO.QLOCAL"
  wait_ms: 30000

testdata:
  user_id: "U000000001"
  book_id: "B000000001"

# COBOL compiler + LE runtime libraries (placeholders; adapt to your Xplore env)
cobol:
  compiler_loadlib: "IGY640.SIGYCOMP"  # COBOL compiler loadlib (e.g. IGYxxx.SIGYCOMP)

# Backward-compatible alias used by older JCL template(s)
cobol_compiler_loadlib: "IGY640.SIGYCOMP"

le:
  runlib: "CEE.SCEERUN"
  runlib2: "CEE.SCEERUN2"
  linklib: "CEE.SCEELKED"
