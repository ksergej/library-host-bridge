---
- name: Compile (and bind) host programs
  hosts: zos_xplore
  gather_facts: no

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    compile_members:
      - "CBLMQDB2"
    max_rc: 8

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Submit compile+link+bind jobs
      zos_job_submit:
        src: "{{ jcl_pds }}({{ item }})"
        location: data_set
        wait_time_s: 300
        return_output: true
      register: compile_job
      failed_when: compile_job.jobs[0].ret_code.code|int > max_rc
      loop: "{{ compile_members }}"

    - name: Show compile RCs
      debug:
        msg: "{{ item.item }} RC={{ item.jobs[0].ret_code.msg }}"
      loop: "{{ compile_job.results }}"
