---
- name: Compile (and optionally bind) LIBMQTST
  hosts: zos_xplore
  gather_facts: no

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    compile_member: "CBLMQDB2"
    max_rc: 8

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Submit compile+link+bind job {{ compile_member }}
      zos_job_submit:
        src: "{{ jcl_pds }}({{ compile_member }})"
        location: data_set
        wait_time_s: 300
        return_output: true
      register: compile_job
      failed_when: compile_job.jobs[0].ret_code.code|int > max_rc

    - debug:
        msg: "Compile RC={{ compile_job.jobs[0].ret_code.msg }}"
