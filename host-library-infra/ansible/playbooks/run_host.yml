---
- name: Run host job (batch program)
  hosts: zos_xplore
  gather_facts: false

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    run_member: "LIBMQTST"
    run_runtime_smoke_default: "{{ pipeline.run_runtime_smoke_default | default(false) }}"
    run_runtime_smoke_effective: >-
      {{
        (
          (run_runtime_smoke is defined) and
          ((run_runtime_smoke | string | lower) != 'auto')
        )
        | ternary((run_runtime_smoke | bool), (run_runtime_smoke_default | bool))
      }}
    max_rc_run: "{{ pipeline.max_rc.run | default(0) }}"
    wait_time_s: "{{ pipeline.wait_time_s.run | default(300) }}"

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Show runtime smoke mode
      debug:
        msg: >-
          Runtime smoke effective={{ run_runtime_smoke_effective }},
          input={{ run_runtime_smoke | default('undefined') }},
          default={{ run_runtime_smoke_default }}.

    - name: Submit run job {{ run_member }}
      zos_job_submit:
        src: "{{ jcl_pds }}({{ run_member }})"
        location: data_set
        wait_time_s: "{{ wait_time_s }}"
        return_output: true
      register: run_job
      when: run_runtime_smoke_effective | bool

    - name: Show run RC
      debug:
        msg: "Run RC={{ run_job.jobs[0].ret_code.msg }} (max_rc={{ max_rc_run }})"
      when: run_runtime_smoke_effective | bool

    - name: Fail if run RC exceeds threshold
      ansible.builtin.fail:
        msg: >-
          Run job {{ run_member }} failed RC policy:
          RC={{ run_job.jobs[0].ret_code.msg }},
          threshold={{ max_rc_run }}.
      when: run_runtime_smoke_effective | bool and (run_job.jobs[0].ret_code.code|int > max_rc_run|int)

    - name: Runtime smoke is disabled
      debug:
        msg: "Runtime smoke skipped by effective flag (run_runtime_smoke_effective=false)."
      when: not (run_runtime_smoke_effective | bool)
