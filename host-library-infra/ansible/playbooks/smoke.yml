---
- name: Host smoke pipeline (deploy → schema → data → compile → run)
  hosts: zos_xplore
  gather_facts: no

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    max_rc_run: 8

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Deploy datasets, sources, JCL, SQL
      import_playbook: library_deploy.yml

    - name: Apply DB2 schema
      import_playbook: db2_schema.yml

    - name: Apply DB2 data
      import_playbook: db2_data.yml

    - name: Compile host program
      import_playbook: compile_host.yml

    - name: Submit run job LIBMQRUN
      zos_job_submit:
        src: "{{ jcl_pds }}(LIBMQRUN)"
        location: DATA_SET
        wait: true
      register: run_job
      failed_when: run_job.jobs[0].ret_code.code|int > max_rc_run

    - debug:
        msg: "Run RC={{ run_job.jobs[0].ret_code.msg }}"
