---
- name: Apply DB2 test data (LIBDATA)
  hosts: zos_xplore
  gather_facts: no

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    run_runtime_skip_db2_default: "{{ pipeline.run_runtime_skip_db2 | default(true) }}"
    run_runtime_skip_db2_effective: >-
      {{
        (
          (run_runtime_skip_db2 is defined) and
          ((run_runtime_skip_db2 | string | lower) != 'auto')
        )
        | ternary((run_runtime_skip_db2 | bool), (run_runtime_skip_db2_default | bool))
      }}
    max_rc: "{{ pipeline.max_rc.data | default(0) }}"
    wait_time_s: "{{ pipeline.wait_time_s.data | default(300) }}"

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Show DB2 data mode
      debug:
        msg: >-
          DB2 data effective skip={{ run_runtime_skip_db2_effective }},
          input={{ run_runtime_skip_db2 | default('undefined') }},
          default={{ run_runtime_skip_db2_default }}.

    - name: Submit data job LIBDATA
      zos_job_submit:
        src: "{{ jcl_pds }}(LIBDATA)"
        location: data_set
        wait_time_s: "{{ wait_time_s }}"
        return_output: true
      register: data_job
      when: not (run_runtime_skip_db2_effective | bool)

    - name: Show data RC
      debug:
        msg: "Data RC={{ data_job.jobs[0].ret_code.msg }} (max_rc={{ max_rc }})"
      when: not (run_runtime_skip_db2_effective | bool)

    - name: Fail if data RC exceeds threshold
      ansible.builtin.fail:
        msg: >-
          DB2 data job failed RC policy:
          RC={{ data_job.jobs[0].ret_code.msg }},
          threshold={{ max_rc }}.
      when: not (run_runtime_skip_db2_effective | bool) and (data_job.jobs[0].ret_code.code|int > max_rc|int)

    - name: DB2 data is skipped
      debug:
        msg: "DB2 data stage skipped by run_runtime_skip_db2=true."
      when: run_runtime_skip_db2_effective | bool
