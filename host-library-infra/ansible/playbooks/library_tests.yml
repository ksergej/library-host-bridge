---
- name: Run host tests for LIBRARY demo
  hosts: zos_xplore
  gather_facts: no

  vars:
    ansible_connection: ssh

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Submit LIBTEST1 job
      zos_job_submit:
        src: "{{ hlq }}.JCL(LIBTEST1)"
        location: data_set
        wait: true
        max_rc: 8
      register: test_job

    - debug:
        msg: "Test RC={{ test_job.jobs[0].ret_code.msg }}"
