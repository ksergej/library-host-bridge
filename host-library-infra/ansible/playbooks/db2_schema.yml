---
- name: Apply DB2 schema (LIBSCHEMA)
  hosts: zos_xplore
  gather_facts: no

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    run_runtime_skip_db2_default: "{{ pipeline.run_runtime_skip_db2 | default(true) }}"
    run_runtime_skip_db2_input: "{{ run_runtime_skip_db2 | default('auto') }}"
    run_runtime_skip_db2_effective: >-
      {{
        (
          (run_runtime_skip_db2_input | string | lower) != 'auto'
        )
        | ternary((run_runtime_skip_db2_input | bool), (run_runtime_skip_db2_default | bool))
      }}
    max_rc: "{{ pipeline.max_rc.schema | default(0) }}"
    wait_time_s: "{{ pipeline.wait_time_s.schema | default(300) }}"

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Show DB2 schema mode
      debug:
        msg: >-
          DB2 schema effective skip={{ run_runtime_skip_db2_effective }},
          input={{ run_runtime_skip_db2_input }},
          default={{ run_runtime_skip_db2_default }}.

    - name: Submit schema job LIBSCHEMA
      zos_job_submit:
        src: "{{ jcl_pds }}(LIBSCHEM)"
        location: data_set
        wait_time_s: "{{ wait_time_s }}"
        return_output: true
      register: schema_job
      when: not (run_runtime_skip_db2_effective | bool)

    - name: Show schema RC
      debug:
        msg: "Schema RC={{ schema_job.jobs[0].ret_code.msg }} (max_rc={{ max_rc }})"
      when: not (run_runtime_skip_db2_effective | bool)

    - name: Fail if schema RC exceeds threshold
      ansible.builtin.fail:
        msg: >-
          DB2 schema job failed RC policy:
          RC={{ schema_job.jobs[0].ret_code.msg }},
          threshold={{ max_rc }}.
      when: not (run_runtime_skip_db2_effective | bool) and (schema_job.jobs[0].ret_code.code|int > max_rc|int)

    - name: DB2 schema is skipped
      debug:
        msg: "DB2 schema stage skipped by run_runtime_skip_db2=true."
      when: run_runtime_skip_db2_effective | bool
