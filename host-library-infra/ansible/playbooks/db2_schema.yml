---
- name: Apply DB2 schema (LIBSCHEMA)
  hosts: zos_xplore
  gather_facts: no

  vars:
    jcl_pds: "{{ hlq }}.JCL"
    max_rc: 0

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Submit schema job LIBSCHEMA
      zos_job_submit:
        src: "{{ jcl_pds }}(LIBSCHEM)"
        location: data_set
        wait_time_s: 300
        return_output: true
      register: schema_job
      failed_when: schema_job.jobs[0].ret_code.code|int > max_rc

    - debug:
        msg: "Schema RC={{ schema_job.jobs[0].ret_code.msg }}"
