---
- name: Deploy host COBOL programs + JCL
  hosts: zos_xplore
  gather_facts: no

  vars:
    ansible_connection: ssh

    cobol_pds: "{{ hlq }}.CBL"
    cbl_pds: "{{ cobol_pds }}"
    jcl_pds:   "{{ hlq }}.JCL"
    load_pds:  "{{ hlq }}.LOAD"
    dbrm_pds:  "{{ db2.dbrmlib }}"
    sql_pds:   "{{ hlq }}.SQL"

    rendered_dir: "{{ playbook_dir }}/../.ansible_tmp/rendered"
    host_programs:
      - member: "LIBMQTST"
        src: "LIBMQTST.cbl"
      - member: "LIBMQCIC"
        src: "LIBMQCIC.cbl"
    compile_jobs:
      - member: "CBLMQDB2"
        template: "CBLMQDB2.jcl.j2"
        host_program_member: "LIBMQTST"
      - member: "CBLMQCIC"
        template: "CBLMQCIC.jcl.j2"
        host_program_member: "LIBMQCIC"

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Preflight | verify zoautil_py available
      ansible.builtin.command: "{{ ansible_python_interpreter }} -c \"import zoautil_py; print('ZOAU OK')\""
      register: zoau_check
      changed_when: false
      failed_when: zoau_check.rc != 0
      environment: "{{ environment_vars }}"

    - name: Create COBOL PDS
      zos_data_set:
        name: "{{ cobol_pds }}"
        type: pds
        state: present
        record_format: fb
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Create JCL PDS
      zos_data_set:
        name: "{{ jcl_pds }}"
        type: pds
        state: present
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Create LOAD PDSE
      zos_data_set:
        name: "{{ load_pds }}"
        type: pdse
        state: present
        record_length: 0
        block_size: 0
        space_primary: 10
        space_secondary: 5
        space_type: cyl

    - name: Create DBRM PDS
      zos_data_set:
        name: "{{ dbrm_pds }}"
        type: pds
        state: present
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Create SQL PDS
      zos_data_set:
        name: "{{ sql_pds }}"
        type: pds
        state: present
        record_format: fb
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Upload COBOL programs
      zos_copy:
        src: "{{ playbook_dir }}/../../cobol/{{ item.src }}"
        dest: "{{ cobol_pds }}({{ item.member }})"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047
      loop: "{{ host_programs }}"
      tags: [cobol, copy, source]

    - name: Upload COBOL copybook LIBLOAN
      zos_copy:
        src: "{{ playbook_dir }}/../../cobol/LIBLOAN.cpy"
        dest: "{{ cobol_pds }}(LIBLOAN)"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047
      tags: [cobol, copy, source]

    - name: Prepare local rendered JCL directory
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory
      delegate_to: localhost
      run_once: true
      vars:
        ansible_connection: local

    - name: Render canonical compile+link+bind JCL locally
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/jcl/{{ item.template }}"
        dest: "{{ rendered_dir }}/{{ item.member }}.jcl"
      delegate_to: localhost
      run_once: true
      vars:
        ansible_connection: local
        host_program_member: "{{ item.host_program_member }}"
        compile_member: "{{ item.member }}"
      loop: "{{ compile_jobs }}"

    - name: Assert rendered compile JCL has no unresolved Jinja markers
      ansible.builtin.command: "grep -n \"{{ jinja_open }}\" \"{{ rendered_dir }}/{{ item.member }}.jcl\""
      register: jinja_marker_check
      changed_when: false
      failed_when: jinja_marker_check.rc == 0
      delegate_to: localhost
      run_once: true
      vars:
        jinja_open: "{{ '{{' }}"
        ansible_connection: local
      loop: "{{ compile_jobs }}"

    - name: Upload canonical compile+link+bind JCL members
      zos_copy:
        src: "{{ rendered_dir }}/{{ item.member }}.jcl"
        dest: "{{ jcl_pds }}({{ item.member }})"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047
      loop: "{{ compile_jobs }}"
      tags: [jcltst]

    - name: Upload run JCL LIBMQTST
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBMQTST.jcl.j2"
        dest: "{{ jcl_pds }}(LIBMQTST)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047
      tags: [jcltst]

    - name: Upload DB2 schema JCL
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBSCHEMA.jcl.j2"
        dest: "{{ jcl_pds }}(LIBSCHEM)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload DB2 data JCL
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBDATA.jcl.j2"
        dest: "{{ jcl_pds }}(LIBDATA)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload SQL schema member
      zos_copy:
        src: "{{ playbook_dir }}/../../db2/schema.sql"
        dest: "{{ sql_pds }}(SCHEMA)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload SQL data member
      zos_copy:
        src: "{{ playbook_dir }}/../../db2/testdata.sql"
        dest: "{{ sql_pds }}(TESTDATA)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

