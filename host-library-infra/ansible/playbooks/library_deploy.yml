---
- name: Deploy LIBMQTST COBOL + JCL
  hosts: zos_xplore
  gather_facts: no

  vars:
    ansible_connection: ssh

    cobol_pds: "{{ hlq }}.CBL"
    jcl_pds:   "{{ hlq }}.JCL"
    load_pds:  "{{ hlq }}.LOAD"
    dbrm_pds:  "{{ hlq }}.DBRMLIB"
    sql_pds:   "{{ hlq }}.SQL"

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Preflight | verify zoautil_py available
      ansible.builtin.command: "{{ ansible_python_interpreter }} -c \"import zoautil_py; print('ZOAU OK')\""
      register: zoau_check
      changed_when: false
      failed_when: zoau_check.rc != 0
      environment: "{{ environment_vars }}"

    - name: Create COBOL PDS
      zos_data_set:
        name: "{{ cobol_pds }}"
        type: pds
        state: present
        record_format: fb
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Create JCL PDS
      zos_data_set:
        name: "{{ jcl_pds }}"
        type: pds
        state: present
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Create LOAD PDSE
      zos_data_set:
        name: "{{ load_pds }}"
        type: pdse
        state: present
        record_length: 0
        block_size: 0
        space_primary: 10
        space_secondary: 5
        space_type: cyl

    - name: Create DBRM PDS
      zos_data_set:
        name: "{{ dbrm_pds }}"
        type: pds
        state: present
        record_length: 80
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Create SQL PDS
      zos_data_set:
        name: "{{ sql_pds }}"
        type: pds
        state: present
        record_length: 256
        block_size: 0
        space_primary: 5
        space_secondary: 5
        space_type: cyl

    - name: Upload COBOL program LIBMQTST
      zos_copy:
        src: "{{ playbook_dir }}/../../cobol/LIBMQTST.cbl"
        dest: "{{ cobol_pds }}(LIBMQTST)"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload COBOL copybook LIBLOAN
      zos_copy:
        src: "{{ playbook_dir }}/../../cobol/LIBLOAN.cpy"
        dest: "{{ cobol_pds }}(LIBLOAN)"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload compile JCL LIBMQTSTC
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBMQTSTC.jcl.j2"
        dest: "{{ jcl_pds }}(LIBMQC)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload run JCL LIBMQTST
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBMQTST.jcl.j2"
        dest: "{{ jcl_pds }}(LIBMQRUN)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload DB2 schema JCL
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBSCHEMA.jcl.j2"
        dest: "{{ jcl_pds }}(LIBSCHEM)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload DB2 data JCL
      zos_copy:
        src: "{{ playbook_dir }}/../templates/jcl/LIBDATA.jcl.j2"
        dest: "{{ jcl_pds }}(LIBDATA)"
        use_template: true
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload SQL schema member
      zos_copy:
        src: "{{ playbook_dir }}/../../db2/schema.sql"
        dest: "{{ sql_pds }}(SCHEMA)"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

    - name: Upload SQL data member
      zos_copy:
        src: "{{ playbook_dir }}/../../db2/testdata.sql"
        dest: "{{ sql_pds }}(TESTDATA)"
        force: true
        encoding:
          from: ISO8859-1
          to: IBM-1047

#    - name: Upload test JCL LIBTEST01
#      zos_copy:
#        src: "{{ playbook_dir }}/../../jcl/test/LIBTEST01.jcl"
#        dest: "{{ jcl_pds }}(LIBTEST1)"
#        force: true
#        encoding:
#          from: ISO8859-1
#          to: IBM-1047

    - name: Submit compile job LIBMQC
      zos_job_submit:
        src: "{{ jcl_pds }}(LIBMQC)"
        location: data_set
        wait_time_s: 300
        return_output: true
        max_rc: 8
      register: compile_job

    - debug:
        msg: "Compile RC={{ compile_job.jobs[0].ret_code.msg }}"
