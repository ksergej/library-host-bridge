name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run ECS image build/push steps"
        required: false
        type: boolean
        default: false
      run_deploy:
        description: "Run ECS service deploy steps (implies build/push)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'LIBRARY-ECS-CLUSTER' }}
      ECS_SERVICE_COMMAND: ${{ vars.ECS_SERVICE_COMMAND }}
      ECS_SERVICE_QUERY: ${{ vars.ECS_SERVICE_QUERY }}
      ECR_REPO_COMMAND: ${{ vars.ECR_REPO_COMMAND }}
      ECR_REPO_QUERY: ${{ vars.ECR_REPO_QUERY }}
      ENABLE_LATEST_TAG: ${{ vars.ENABLE_LATEST_TAG || 'false' }}
      ECS_PIPELINE_ENABLED: ${{ vars.ECS_PIPELINE_ENABLED || 'false' }}
      ECS_RUN_ON_PUSH_MAIN: ${{ vars.ECS_RUN_ON_PUSH_MAIN || 'false' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ECS pipeline switches
        id: gate
        env:
          INPUT_RUN_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_build || 'false' }}
          INPUT_RUN_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy || 'false' }}
        run: |
          set -euo pipefail

          run_build=false
          run_deploy=false
          reason=""

          if [[ "${ECS_PIPELINE_ENABLED}" != "true" ]]; then
            reason="ECS pipeline disabled by var ECS_PIPELINE_ENABLED=${ECS_PIPELINE_ENABLED}"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              if [[ "${INPUT_RUN_BUILD}" == "true" || "${INPUT_RUN_DEPLOY}" == "true" ]]; then
                run_build=true
              fi
              if [[ "${INPUT_RUN_DEPLOY}" == "true" ]]; then
                run_deploy=true
              fi
              if [[ "${run_build}" != "true" ]]; then
                reason="workflow_dispatch requested no ECS actions (run_build=false and run_deploy=false)"
              fi
            elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              if [[ "${ECS_RUN_ON_PUSH_MAIN}" == "true" ]]; then
                run_build=true
                run_deploy=true
              else
                reason="push to main detected, but ECS_RUN_ON_PUSH_MAIN=false"
              fi
            else
              reason="event ${GITHUB_EVENT_NAME} is not configured for ECS actions"
            fi
          fi

          if [[ "${run_deploy}" == "true" ]]; then
            run_build=true
          fi

          echo "run_build=${run_build}" >> "${GITHUB_OUTPUT}"
          echo "run_deploy=${run_deploy}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

          echo "ECS gate: run_build=${run_build}, run_deploy=${run_deploy}"
          if [[ "${run_build}" != "true" && -n "${reason}" ]]; then
            echo "::notice::${reason}"
          fi

      - name: ECS pipeline no-op (current default)
        if: steps.gate.outputs.run_build != 'true'
        run: |
          echo "ECS build/deploy steps are skipped."
          echo "Reason: ${{ steps.gate.outputs.reason }}"

      - name: Set up Java
        if: steps.gate.outputs.run_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show Java and Maven versions
        if: steps.gate.outputs.run_build == 'true'
        run: |
          java -version
          mvn -version

      - name: Validate build config
        if: steps.gate.outputs.run_build == 'true'
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::Missing required secret AWS_ROLE_TO_ASSUME"
            missing=1
          fi
          if [[ -z "${ECR_REPO_COMMAND}" ]]; then
            echo "::error::Missing required var ECR_REPO_COMMAND"
            missing=1
          fi
          if [[ -z "${ECR_REPO_QUERY}" ]]; then
            echo "::error::Missing required var ECR_REPO_QUERY"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Validate deploy config
        if: steps.gate.outputs.run_deploy == 'true'
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${ECS_SERVICE_COMMAND}" ]]; then
            echo "::error::Missing required var ECS_SERVICE_COMMAND"
            missing=1
          fi
          if [[ -z "${ECS_SERVICE_QUERY}" ]]; then
            echo "::error::Missing required var ECS_SERVICE_QUERY"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      # CD workflow skips tests to avoid duplicating CI; CI already runs mvn -U test.
      - name: Build artifacts (skip tests)
        if: steps.gate.outputs.run_build == 'true'
        run: mvn -DskipTests package

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.run_build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.run_build == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push loan-command-service image
        if: steps.gate.outputs.run_build == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO_COMMAND}:${GITHUB_SHA}"
          docker build -f loan-command-service/Dockerfile -t "$IMAGE_URI" loan-command-service
          docker push "$IMAGE_URI"
          if [[ "${ENABLE_LATEST_TAG}" == "true" ]]; then
            LATEST_URI="${ECR_REGISTRY}/${ECR_REPO_COMMAND}:latest"
            docker tag "$IMAGE_URI" "$LATEST_URI"
            docker push "$LATEST_URI"
          fi

      - name: Build and push loan-query-service image
        if: steps.gate.outputs.run_build == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO_QUERY}:${GITHUB_SHA}"
          docker build -f loan-query-service/Dockerfile -t "$IMAGE_URI" loan-query-service
          docker push "$IMAGE_URI"
          if [[ "${ENABLE_LATEST_TAG}" == "true" ]]; then
            LATEST_URI="${ECR_REGISTRY}/${ECR_REPO_QUERY}:latest"
            docker tag "$IMAGE_URI" "$LATEST_URI"
            docker push "$LATEST_URI"
          fi

      - name: Render task definition (loan-command-service)
        if: steps.gate.outputs.run_deploy == 'true'
        id: render-command
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/taskdef-loan-command.json
          container-name: loan-command
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_COMMAND }}:${{ github.sha }}

      - name: Render task definition (loan-query-service)
        if: steps.gate.outputs.run_deploy == 'true'
        id: render-query
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/taskdef-loan-query.json
          container-name: loan-query
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_QUERY }}:${{ github.sha }}

      - name: Deploy loan-command-service
        if: steps.gate.outputs.run_deploy == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-command.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_COMMAND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy loan-query-service
        if: steps.gate.outputs.run_deploy == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-query.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_QUERY }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
